<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}" {% if page.url == "/" %}class="active"{% endif %}>Ayushi Batwara</a>
    <a href="{{ '/reading/' | relative_url }}" {% if page.url == "/reading/" %}class="active"{% endif %}>Reading</a>
    <a href="{{ '/writing/' | relative_url }}" {% if page.url == "/writing/" %}class="active"{% endif %}>Writing</a>
  </nav>
  <article>
    <h1>{{ page.title }}</h1>
    {{ content }}
  </article>
</body>
</html>
